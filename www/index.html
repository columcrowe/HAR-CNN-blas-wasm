<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HAR Classification BLAS Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
	<div id="info">
		<progress id="progressBar" value="0" max="100" style="width: 50vw;"></progress>
		<span id="progressText"></span>
	</div>
	<div id="control">
		<button type="button" id="uploadFile" onclick="document.getElementById('FileInput').click()">Upload File</button>
		<input type="file" id="FileInput" hidden style="display: none;" />
	  <button type="button" id="defaultExample" >Load Example</button>
	  <label style="float: right;"> <input type="checkbox" id="live-update" checked style="float: right;" /> Update Plot </label>
	</div>
	<div id="container">
		<div id="draw"></div> <!-- populated by drawSignal !-->
		<div id="hist"></div>		
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
		<script src="https://leeoniya.github.io/uPlot/dist/uPlot.iife.min.js"></script>
		<link
			rel="stylesheet"
			href="https://leeoniya.github.io/uPlot/dist/uPlot.min.css"
		/>
  <script>
    var Module = {};
    Module.onRuntimeInitialized = () => {
      doLoadData();
    };
    Module.onAbort = () => {
      doAbort();
    };
  </script>
  <script src="main.js"></script>
  <script src="index.js"></script>
</body>

</html>
